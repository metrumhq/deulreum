<!DOCTYPE html>

<head>
  
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #160F29; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #FFB089; font-size: 15px; font-weight: 600; }
    #loading svg { width: 72px; height: 72px; animation: bob 1.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
  </style>
</head>
<body>
  <div id="loading">
    <svg viewBox="0 0 100 100"><path d="M50 8C29 8 16 24 16 43C16 64 50 92 50 92C50 92 84 64 84 43C84 24 71 8 50 8Z" fill="#FF6A3D"/><ellipse cx="47" cy="40" rx="5.5" ry="8" fill="#1E1633"/><ellipse cx="66" cy="40" rx="5.5" ry="8" fill="#1E1633"/></svg>
    <div>들름을 여는 중…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
